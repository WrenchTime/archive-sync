name: Archive sync

on:
  schedule:
    - cron: "17 3 * * *"   # every day, 03:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would change, write nothing"
        type: boolean
        default: false

concurrency:
  group: archive-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Sync
        env:
          GH_TOKEN: ${{ secrets.ARCHIVE_TOKEN }}
        run: bash sync.sh ${{ inputs.dry_run && '--dry-run' || '' }}
